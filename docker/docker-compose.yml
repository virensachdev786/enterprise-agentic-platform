version: "3.9"

services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma-vdb
    restart: unless-stopped
    ports:
      - "8050:8000"        # HOST:CONTAINER
    volumes:
      - chroma_data:/chroma/.chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  chroma_data:

